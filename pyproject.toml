[project]
name = "autopay-recovery-agent"
version = "0.1.0"
description = "Voice agent that recovers failed autopay (recurring mandate) payments, with guardrails enforced in code."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"]
